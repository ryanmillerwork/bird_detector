<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Photo Frame</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    img { width: 100vw; height: 100vh; object-fit: contain; display: block; }
    #err { color: #888; font: 16px/1.4 system-ui, sans-serif; position: fixed; left: 8px; top: 8px; }
  </style>
</head>
<body>
  <p id="err" aria-live="polite"></p>
  <img id="frame" src="latest.jpg" alt="latest detection">

  <script>
    (function () {
      const errEl = document.getElementById('err');
      const img = document.getElementById('frame');
      const params = new URLSearchParams(location.search);
      const port = (params.get('wsport') || '8766').replace(/[^0-9]/g, '') || '8766';
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const url = proto + '://' + location.hostname + ':' + port;

      let prev = null;
      function showErr(msg) { errEl.textContent = msg || ''; }

      function connect() {
        const ws = new WebSocket(url);
        ws.binaryType = 'arraybuffer';
        showErr('connecting to ' + url + '…');

        ws.onopen = function () { showErr(''); };
        ws.onmessage = function (ev) {
          if (!ev.data) return;
          if (typeof ev.data === 'string') return;
          const b = new Blob([ev.data], { type: 'image/jpeg' });
          if (prev) { try { URL.revokeObjectURL(prev); } catch (e) {} }
          prev = URL.createObjectURL(b);
          img.src = prev;
        };
        ws.onclose = function () { showErr('reconnecting…'); setTimeout(connect, 1500); };
        ws.onerror = function () { showErr('WebSocket error'); };
      }
      connect();
    })();
  </script>
</body>
</html>
